[gcode_macro START_PRINT]
gcode:
    # 1. Capture parameters from any slicer format (Orca, Prusa, SuperSlicer)
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|float %}

    # 2. Reset speed/flow and coordinate systems
    M220 S100 ; Reset speed factor
    M221 S100 ; Reset flow rate
    G90       ; Absolute positioning
    M83       ; Relative extruder mode

    # 3. Start bed heating and preheat nozzle to 150C (prevents oozing on bed during probe/mesh)
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150

    # 4. Home all axes (uses [safe_z_home])
    G28

    # 5. Wait for bed to reach final temperature
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1} MAXIMUM={BED_TEMP + 5}

    # 6. Adaptive Bed Mesh
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 7. Heat nozzle to final print temperature
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP - 2} MAXIMUM={EXTRUDER_TEMP + 5}

    # 8. Adaptive Line Purge (KAMP) or standard prime line
    {% if 'gcode_macro LINE_PURGE' in printer %}
        LINE_PURGE
    {% else %}
        G1 Z2.0 F3000
        G1 X5 Y10 Z0.3 F5000.0
        G1 X5 Y150.0 Z0.3 F1500.0 E15
        G1 X5.4 Y150.0 Z0.3 F5000.0
        G1 X5.4 Y10 Z0.3 F1500.0 E30
        G92 E0
        G1 Z2.0 F3000
    {% endif %}


[gcode_macro END_PRINT]
gcode:
    # Retract slightly to prevent oozing
    G91
    G1 E-2 F2700
    G1 E-1.5 Z0.2 F2400
    G1 X5 Y5 F3000
    G1 Z10 F3000
    G90

    # Park toolhead at rear
    G1 X10 Y200 F6000

    # Turn off heaters and fans
    TURN_OFF_HEATERS
    M107
    M84 X Y E ; Disable steppers (keep Z engaged if needed)
    BED_MESH_CLEAR