###################################################################################
# MCUs
###################################################################################

################################
# BTT SKR Mini E3 V1.2 Mainboard
################################
[mcu]
#serial:
#baud: 250000
#canbus_uuid:
#canbus_interface:
#restart_method:
#is_non_critical: False
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_31FFDB054246303110680557-if00

################################
# Klipper Expander
################################
[include configFiles/klipperExpander.cfg]

################################
# Raspberry Pi 3
################################
[include configFiles/raspberryPi.cfg]

###################################################################################
# Main Printer Attributes
###################################################################################
[printer]
kinematics: corexz
max_velocity: 230
max_accel: 14025
square_corner_velocity: 5.0
max_z_velocity: 163
max_z_accel: 9917

###################################################################################
# Motors
###################################################################################
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 218
position_max: 218
homing_speed: 70
homing_positive_dir: true

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 226
homing_speed: 50
homing_positive_dir: false

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32
full_steps_per_rotation: 200

rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
homing_speed: 40
position_min: -5.0
position_max: 206

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 22.6789511
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 120.0
pressure_advance: 0.0
pressure_advance_smooth_time: 0.016
heater_pin: PC8
max_power: 1.0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
control = pid
pid_kp = 40.080
pid_ki = 2.569
pid_kd = 156.313
min_extrude_temp: 180
min_temp: 0
max_temp: 300

###################################################################################
# Bed Heater
###################################################################################
[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
control = pid
pid_kp = 58.129
pid_ki = 1.036
pid_kd = 815.265
min_temp: 0
max_temp: 130

###################################################################################
# Bed Mesh
###################################################################################

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 25
mesh_max: 213, 221
probe_count: 5, 5
fade_start: 0.6
fade_end: 10.0
fade_target: 0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 110, 111
adaptive_margin: 5

###################################################################################
# Bed Screw Automated Calibration
###################################################################################

[screws_tilt_adjust]
screw1: 25, 171
screw1_name: rear left screw
screw2: 195, 1
screw2_name: front right screw
screw3: 25, 1
screw3_name: front left screw
screw4: 196, 171
screw4_name: rear right screw
speed: 100
horizontal_move_z: 5
screw_thread: CW-M4

###################################################################################
# Skew Calibration
###################################################################################
[skew_correction]

###################################################################################
# Macros
###################################################################################

[include macros/gitHubBackUp.cfg]
[include macros/speedCalibration.cfg]
[include timelapse.cfg]

###################################################################################
# Save Variables, persistant on restart
###################################################################################
[save_variables]
filename = ~/demon_vars.cfg

###################################################################################
# Idle Timeout
###################################################################################
[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

###################################################################################
# Turn on Force Move
###################################################################################
[force_move]
enable_force_move: True

###################################################################################
# Firmware Retraction
###################################################################################

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

###################################################################################
# G-Code Arcs
###################################################################################

[gcode_arcs]
resolution: 0.1

###################################################################################
# Exclude Object (Enabled by default in Kalico)
###################################################################################

[exclude_object]

###################################################################################
# Input Shaper
###################################################################################
[input_shaper]
shaper_freq_x: 53.0
shaper_type_x: mzv
shaper_freq_y: 32.0
shaper_type_y: mzv

###################################################################################
# Input Shaper Hardware
###################################################################################
[include configFiles/ADXL345.cfg]

###################################################################################
#Input Shaper Hardware
###################################################################################
[resonance_tester]
probe_points:
    109,113,20
accel_chip_x: adxl345 hotend
accel_chip_y: adxl345 bed
max_freq: 150
sweeping_period: 1.2

###################################################################################
# Additional Pins
###################################################################################
[static_digital_output usb_pullup_enable]
pins: !PC13

[board_pins]
aliases:
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PB6, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7, EXP1_10=<5V>

[output_pin beeper]
pin: EXP1_1

###################################################################################
# Include Files
###################################################################################
[include moongate.cfg]
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
[include ./KAMP_LiTE/*.cfg]
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./Neopixel_Control.cfg]
[include ./Heat_Soak_Toolhead_LEDs.cfg]
[include ./My_Macros.cfg]
# Hardware
[include mainsail.cfg]
[include configFiles/TMCAutoTune.cfg]
[include configFiles/klippain-shaketune.cfg]

###################################################################################
# Probe
###################################################################################
[probe]
pin: ^PC2
x_offset: 0
y_offset: 25
z_offset = 0.291
speed: 5.0
samples: 2
sample_retract_dist: 3.0
lift_speed: 15
samples_result: median
samples_tolerance: 0.00625
samples_tolerance_retries: 20

###################################################################################
# Host Sensors
###################################################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

###################################################################################
# Fans
###################################################################################
[heater_fan heatbreak_cooling_fan]
pin: PA8

###################################################################################
# Leds
###################################################################################
# Hardware
[include configFiles/leds.cfg]

###################################################################################
# TMC Driver Configuration
###################################################################################
[tmc2209 stepper_x]
uart_pin: PB15
interpolate: False
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PC6
interpolate: False
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC10
interpolate: False
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PC11
interpolate: False
run_current: 0.600
sense_resistor: 0.110
stealthchop_threshold: 0

###################################################################################
# Display
###################################################################################
[display]
lcd_type: st7920
menu_timeout: 300
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8

###################################################################################
# Filament Runot Sensor
###################################################################################
[include configFiles/bttSmartFilamentSensorV1.cfg]
